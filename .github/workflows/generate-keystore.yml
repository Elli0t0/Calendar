name: Generate Keystore

on:
  workflow_dispatch:

jobs:
  generate:
    name: Generate release keystore
    runs-on: ubuntu-24.04
    steps:
      - name: Generate keystore with keytool
        shell: bash
        run: |
          set -euo pipefail
          GEN_PASS=$(openssl rand -hex 16)
          keytool -genkeypair -keystore "$RUNNER_TEMP/calendar-release.jks" -alias calendar \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$GEN_PASS" -keypass "$GEN_PASS" \
            -dname "CN=Calendar, OU=Calendar, O=Calendar, L=Unknown, ST=Unknown, C=US" > /dev/null 2>&1
          printf '%s' "$GEN_PASS" > "$RUNNER_TEMP/calendar-keystore-password.txt"
          ls -l "$RUNNER_TEMP/calendar-release.jks" "$RUNNER_TEMP/calendar-keystore-password.txt"

      - name: Upload keystore artifact
        uses: actions/upload-artifact@v4
        with:
          name: calendar-signing-keystore
          path: |
            ${{ runner.temp }}/calendar-release.jks
            ${{ runner.temp }}/calendar-keystore-password.txt
          if-no-files-found: error
          retention-days: 30
